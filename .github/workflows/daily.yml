name: daily-video
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      NICHE: ${{ vars.NICHE }}
      LANGUAGE: ${{ vars.LANGUAGE }}
      VOICE: ${{ vars.VOICE }}
      UTC_OFFSET_HOURS: "3"
      SHORT_PUBLISH_TIME: ${{ vars.SHORT_PUBLISH_TIME || '18:00' }}
      LONG_PUBLISH_TIME: ${{ vars.LONG_PUBLISH_TIME || '20:00' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Short (roz)
        run: python main.py short
      - name: Long (Mon, Wed, Fri)
        run: |
          D=$(date +%u)
          if [ "$D" = "1" ] || [ "$D" = "3" ] || [ "$D" = "5" ]; then python main.py long; fi
      - name: Save history
        run: |
          git config user.name bot && git config user.email bot@example.com
          git add history.json && git commit -m "history" || true
          git push || true
